name: budgeting_app
description: "Pitaka - an offline-first personal budget and expense tracker."
publish_to: 'none'

# Release: bump this (name+build), add a matching entry in lib/core/changelog.dart
# and publish a GitHub release tagged with the same version, e.g. v1.2.0
# (see docs/RELEASING.md).
version: 1.2.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Local database, encrypted with SQLCipher (same API as sqflite)
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.0

  # Charts, formatting, files, notifications
  fl_chart: ^1.3.0
  intl: ^0.20.2
  file_picker: ^13.4.0
  flutter_local_notifications: ^23.0.3
  timezone: '>=0.10.0 <0.12.0'

  # Login + encryption: password-derived keys (PBKDF2 + AES-GCM),
  # optional fingerprint unlock with the key in the OS keystore.
  local_auth: ^3.0.2
  crypto: ^3.0.6
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0

  # Business photos: camera / gallery through the system picker (no CAMERA
  # or storage permission on Android), compressed on device, saved in the
  # app's private documents folder.
  image_picker: ^1.2.4
  path_provider: ^2.1.6

  # App updates: the installed version (to compare) and opening the
  # download link in the browser.
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # App icon + splash generators (dev tools only, not shipped in the app).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    # Payment QR placeholders: replace maya.png, maribank.png and bdo.png
    # with your own QR images (same file names).
    - assets/qr/

# `dart run flutter_launcher_icons`
# To use your own logo: replace assets/logo/logo.png (1024x1024, transparent)
# and assets/logo/logo_foreground.png (same logo with ~20% empty margin), then run it.
flutter_launcher_icons:
  image_path: "assets/logo/logo.png"
  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "#EEF2FF"
  adaptive_icon_foreground: "assets/logo/logo_foreground.png"
  # The project has no ios/ folder yet. After `flutter create --platforms=ios .`
  # set this to true and run the command again.
  ios: false
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
    icon_size: 256

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F7F8FC"
  color_dark: "#0A0D14"
  image: "assets/logo/logo.png"
  android_12:
    image: "assets/logo/splash_android12.png"
    color: "#F7F8FC"
    color_dark: "#0A0D14"
  android: true
  ios: false
  web: false

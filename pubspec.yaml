name: budgeting_app
description: "Pitaka - an offline-first personal budget and expense tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Local database
  sqflite: ^2.4.6
  path: ^1.9.0

  # Charts, formatting, files, notifications
  fl_chart: ^1.3.0
  intl: ^0.20.2
  file_picker: ^13.4.0
  flutter_local_notifications: ^23.0.3
  timezone: '>=0.10.0 <0.12.0'

  # App lock
  local_auth: ^3.0.2
  crypto: ^3.0.6

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

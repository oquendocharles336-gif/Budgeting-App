name: budgeting_app
description: "Pitaka - an offline-first personal budget and expense tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Local database, encrypted with SQLCipher (same API as sqflite)
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.0

  # Charts, formatting, files, notifications
  fl_chart: ^1.3.0
  intl: ^0.20.2
  file_picker: ^13.4.0
  flutter_local_notifications: ^23.0.3
  timezone: '>=0.10.0 <0.12.0'

  # Login + encryption: password-derived keys (PBKDF2 + AES-GCM),
  # optional fingerprint unlock with the key in the OS keystore.
  local_auth: ^3.0.2
  crypto: ^3.0.6
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

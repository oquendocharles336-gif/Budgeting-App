<?xml version="1.0" encoding="UTF-8"?>
<!-- Pitaka logo: a wallet with a coin. Primary color #4F46E5 (app accent). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Coin (with a peso sign) dropping into the wallet -->
  <circle cx="560" cy="250" r="165" fill="url(#coin)"/>
  <circle cx="560" cy="250" r="120" fill="none" stroke="#B45309" stroke-opacity="0.30" stroke-width="20"/>
  <path d="M522 330 V172 h48 a46 46 0 0 1 0 92 h-48" fill="none" stroke="#A16207" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M488 202 H640 M488 236 H640" fill="none" stroke="#A16207" stroke-width="16" stroke-linecap="round"/>
  <!-- Back flap -->
  <rect x="150" y="330" width="724" height="140" rx="70" fill="#3730A3"/>
  <!-- Wallet body -->
  <rect x="120" y="390" width="784" height="500" rx="96" fill="url(#body)"/>
  <!-- Stitch line -->
  <rect x="176" y="446" width="672" height="388" rx="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" stroke-dasharray="28 22"/>
  <!-- Clasp -->
  <rect x="640" y="560" width="264" height="164" rx="82" fill="#312E81"/>
  <circle cx="722" cy="642" r="38" fill="#FCD34D"/>
</svg>
